<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16204A">
<title>Akshardham Task Reporting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16204A; --ink2:#2B3A78; --paper:#EEF1F7; --card:#FFFFFF; --line:#D9DEEA; --mute:#5E6683;
  --gold:#F2A20C; --gold-soft:#FFE7B3;
  --done:#2E8B57; --done-bg:#E3F2EA;
  --wip:#D98E04;  --wip-bg:#FFF3D6;
  --nd:#C2412D;   --nd-bg:#F9E3DF;
  --bl:#7A3E9D;   --bl-bg:#EFE4F6;
  --vp:#147C8A;   --vp-bg:#DDF0F2;
  --ns:#9AA1B8;   --ns-bg:#EEF0F5;
  --wa:#1FA855;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Mukta,system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num{font-family:Rajdhani,Mukta,sans-serif;font-weight:700;letter-spacing:.01em}

/* ---------- header with survey-grid texture ---------- */
.top{background-color:var(--ink);color:#fff;padding:14px 16px 20px;
  background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);
  background-size:24px 24px}
.top-in{max-width:620px;margin:0 auto}
.top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hello{font-size:20px;font-weight:700;line-height:1.2}
.sub{font-size:14px;opacity:.72;margin-top:2px}
.top-actions{display:flex;gap:6px}
.ibtn{width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;display:grid;place-items:center;text-decoration:none}
.ibtn svg{width:20px;height:20px}
.page-title{font-family:Rajdhani,Mukta,sans-serif;font-size:28px;font-weight:700;margin:18px 0 0;line-height:1.1}
.page-sub{font-size:14px;opacity:.75;margin-top:4px}

/* ---------- aaj ka naksha (the plot map) ---------- */
.naksha-head{display:flex;align-items:flex-end;gap:12px;margin:18px 0 12px}
.score{font-family:Rajdhani,sans-serif;font-weight:700;line-height:.85;white-space:nowrap}
.score b{font-size:56px;color:var(--gold)}
.score span{font-size:28px;opacity:.6}
.score-txt{font-size:15px;opacity:.85;padding-bottom:4px;max-width:30ch}
.naksha{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px;padding:8px;border:1.5px solid rgba(255,255,255,.22);border-radius:6px;background:rgba(255,255,255,.03)}
.plot-tile{aspect-ratio:1.1/1;border:1.5px dashed rgba(255,255,255,.38);border-radius:3px;background:transparent;color:rgba(255,255,255,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:0}
.plot-tile span{font-size:11px;opacity:.7;font-family:Rajdhani,sans-serif;font-weight:600}
.plot-tile b{font-family:Rajdhani,sans-serif;font-size:22px;font-weight:700}
.plot-tile.f-done{background:var(--done);border:1.5px solid var(--done);color:#fff}
.plot-tile.f-wip{background:var(--gold);border:1.5px solid var(--gold);color:var(--ink)}
.plot-tile.f-nd{background:var(--nd);border:1.5px solid var(--nd);color:#fff}
.plot-tile.f-bl{background:var(--bl);border:1.5px solid var(--bl);color:#fff}
.plot-tile.just{animation:fillin .7s cubic-bezier(.2,.8,.25,1.25)}
@keyframes fillin{0%{transform:scale(.55);opacity:.2}100%{transform:none;opacity:1}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;opacity:.85}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.legend .lg-empty{border:1.5px dashed rgba(255,255,255,.6)}

/* ---------- body ---------- */
.wrap{max-width:620px;margin:0 auto;padding:6px 16px calc(96px + env(safe-area-inset-bottom))}
.sec{font-size:15px;font-weight:700;color:var(--mute);margin:22px 2px 8px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:16px}
.panel p{margin:4px 0 0;color:var(--mute);font-size:15px}

/* task card: plot-number block + content */
.task{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}
.task.open{border-color:var(--ink2);box-shadow:0 6px 22px rgba(22,32,74,.10)}
.task-h{display:flex;gap:12px;padding:12px;align-items:stretch;width:100%;text-align:left;background:none;border:0}
.plot{flex:0 0 52px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;background:var(--ns-bg);color:var(--ink)}
.plot span{font-family:Rajdhani,sans-serif;font-size:12px;font-weight:600;opacity:.7}
.plot b{font-family:Rajdhani,sans-serif;font-size:24px;font-weight:700}
.plot.s-done{background:var(--done);color:#fff}.plot.s-vp{background:var(--vp);color:#fff}
.plot.s-wip{background:var(--gold);color:var(--ink)}.plot.s-nd{background:var(--nd);color:#fff}.plot.s-bl{background:var(--bl);color:#fff}
.task-main{flex:1;min-width:0;padding:2px 0}
.task-title{font-weight:600;font-size:16.5px;line-height:1.3}
.task-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;align-items:center}
.tag{font-size:12.5px;font-weight:600;padding:1px 8px;border-radius:20px;background:#E6EAF5;color:var(--ink2)}
.tag.a{background:var(--gold-soft);color:#6B4500}
.due{font-size:13px;color:var(--mute)}
.due.soon{color:#A65F00;font-weight:600}
.due.late{color:var(--nd);font-weight:700}
.pill{font-size:13px;font-weight:700;padding:2px 9px;border-radius:20px}
.p-done{background:var(--done-bg);color:var(--done)}.p-vp{background:var(--vp-bg);color:var(--vp)}
.p-wip{background:var(--wip-bg);color:#8A5A00}.p-nd{background:var(--nd-bg);color:var(--nd)}
.p-bl{background:var(--bl-bg);color:var(--bl)}.p-ns{background:var(--ns-bg);color:var(--mute)}
.task-body{padding:2px 14px 16px;border-top:1px solid var(--line)}
.info{font-size:14.5px;color:var(--mute);margin:12px 0 4px}
.info b{color:var(--ink);font-weight:600}
details{margin:10px 0;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#F8F9FC}
summary{font-weight:600;font-size:14.5px;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:'+';display:inline-block;width:18px;font-weight:700;color:var(--ink2)}
details[open] summary::before{content:'−'}
.steps{white-space:pre-line;font-size:14.5px;line-height:1.6;margin-top:6px}
.note{background:var(--wip-bg);border-radius:10px;padding:9px 12px;font-size:14px;margin-top:10px}
.quote{background:#F4F6FB;border-left:3px solid var(--ink2);border-radius:0 10px 10px 0;padding:10px 12px;font-size:14.5px;margin-top:10px}

/* form */
label{display:block;font-size:14.5px;font-weight:600;margin:14px 0 6px}
label small{font-weight:400;color:var(--mute)}
textarea,input[type=password],input[type=tel],select{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:12px;background:#fff;outline:none;font-size:16px}
textarea{min-height:76px;resize:vertical}
textarea:focus,input:focus,select:focus{border-color:var(--ink2)}
.stgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.st{display:flex;align-items:center;gap:9px;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-weight:700;text-align:left}
.st i{width:14px;height:14px;border-radius:3px;flex:0 0 14px}
.st small{display:block;font-weight:400;font-size:12.5px;color:var(--mute);line-height:1.2}
.st[data-s="Done"] i{background:var(--done)}.st[data-s="WIP"] i{background:var(--gold)}
.st[data-s="Not Done"] i{background:var(--nd)}.st[data-s="Blocked"] i{background:var(--bl)}
.st[data-s="Done"].on{border-color:var(--done);background:var(--done-bg)}
.st[data-s="WIP"].on{border-color:var(--gold);background:var(--wip-bg)}
.st[data-s="Not Done"].on{border-color:var(--nd);background:var(--nd-bg)}
.st[data-s="Blocked"].on{border-color:var(--bl);background:var(--bl-bg)}
.file{display:flex;align-items:center;gap:10px;border:1.5px dashed var(--line);border-radius:12px;padding:11px 13px;font-size:14.5px;color:var(--mute);background:#FAFBFD}
.file input{position:absolute;opacity:0;width:1px;height:1px}
.file svg{width:20px;height:20px;flex:0 0 20px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:13px;padding:14px;font-weight:700;font-size:16px;margin-top:16px;background:var(--ink);color:#fff}
.btn.ok{background:var(--done)}
.btn.soft{background:#E6EAF5;color:var(--ink)}
.btn.out{background:#fff;color:var(--nd);border:1.5px solid var(--nd)}
.btn:disabled{opacity:.6;cursor:wait}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2 .btn{margin-top:12px}

.empty{text-align:center;padding:34px 18px;color:var(--mute);background:var(--card);border:1.5px dashed var(--line);border-radius:16px;margin-top:16px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:2px}

/* done today list */
.donerow{display:flex;gap:12px;align-items:center;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin:8px 0}
.donerow .plot{flex-basis:44px;height:44px}
.donerow .plot b{font-size:20px}
.donerow .t{flex:1;min-width:0}
.donerow .t div{font-weight:600;font-size:15px;line-height:1.3}
.donerow .t p{margin:2px 0 0;font-size:13.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* messages */
.msg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:14px}
.msg h3{margin:0;font-size:16.5px}
.msg .hint{font-size:13.5px;color:var(--mute);margin-top:2px}
.bubble{white-space:pre-wrap;font-size:14.5px;line-height:1.5;margin-top:10px;background:#E8F6EC;border-radius:4px 14px 14px 14px;padding:11px 13px;max-height:320px;overflow:auto}
.bubble.private{background:#F2F4F9}
.mbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.mbtn{display:flex;align-items:center;justify-content:center;gap:7px;border-radius:11px;padding:11px;font-weight:700;font-size:15px;border:1.5px solid var(--line);background:#fff;text-decoration:none;color:var(--ink)}
.mbtn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.mbtn svg{width:18px;height:18px}
.mbtn.full{grid-column:1/-1}
.sentnote{font-size:13.5px;color:var(--done);font-weight:600;margin-top:8px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:10}
.nav-in{max-width:620px;margin:0 auto;display:flex}
.nav button{flex:1;background:none;border:0;padding:6px 2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mute);font-size:12.5px;font-weight:600;position:relative}
.nav button svg{width:23px;height:23px}
.nav button.on{color:var(--ink)}
.nav button.on svg{stroke-width:2.4}
.nav button.on::before{content:'';position:absolute;top:-7px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
.nav .badge{position:absolute;top:1px;left:calc(50% + 6px);min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--nd);color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center}

/* login */
.login-bg{min-height:100vh;background-color:var(--ink);padding:48px 16px;
  background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);background-size:24px 24px}
.login{max-width:400px;margin:0 auto;background:#fff;border-radius:20px;padding:26px 22px 24px}
.login-mark{display:grid;grid-template-columns:repeat(3,14px);gap:3px;margin-bottom:16px}
.login-mark i{height:14px;border-radius:2px;background:var(--line)}
.login-mark i.g{background:var(--gold)}.login-mark i.d{background:var(--done)}
.login h1{font-family:Rajdhani,sans-serif;font-size:28px;line-height:1.05;margin:0}
.login .sub{color:var(--mute);opacity:1;font-size:15px;margin-top:4px}
.pin{letter-spacing:.5em;font-family:Rajdhani,sans-serif;font-size:22px;font-weight:700;text-align:center}
.login .foot{font-size:14px;color:var(--mute);margin-top:16px;text-align:center}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;z-index:50;font-weight:600;max-width:90%;box-shadow:0 10px 28px rgba(22,32,74,.3);text-align:center}
.toast.err{background:var(--nd)}
.loading{text-align:center;padding:70px 16px;color:var(--mute)}
.plot-tile.f-vp{background:var(--vp);border:1.5px solid var(--vp);color:#fff}
.plot-tile.late-mark{box-shadow:inset 0 0 0 2px var(--nd)}
.naksha.big{grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:5px}
.naksha.big .plot-tile b{font-size:18px}
.naksha.big .plot-tile span{font-size:10px}
.updated{font-size:13px;opacity:.6;margin-top:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 4px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;border-radius:22px;padding:7px 13px;font-weight:600;font-size:14.5px;display:flex;gap:7px;align-items:center}
.chip b{font-family:Rajdhani,sans-serif;font-size:17px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.warn b{color:var(--nd)}.chip.on.warn b{color:#FFB4A8}
.prow{display:flex;align-items:center;gap:12px;padding:11px 12px;background:#fff;border:1px solid var(--line);border-radius:12px;margin:8px 0;width:100%;text-align:left}
.prow.on{border-color:var(--ink2);box-shadow:0 0 0 2px var(--ink2) inset}
.prow .pn{flex:0 0 96px;font-weight:600;font-size:15px;line-height:1.25}
.prow .pn small{display:block;font-weight:400;font-size:12.5px;color:var(--mute)}
.prow .pbar{flex:1;min-width:0}
.seg{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--ns-bg)}
.seg i{display:block;height:100%}
.prow .pcount{font-size:13px;color:var(--mute);margin-top:5px;display:flex;justify-content:space-between;gap:8px}
.prow .pcount b{color:var(--ink)}
.prow .pcount .bad{color:var(--nd);font-weight:700}
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--nd);border-radius:10px;margin:8px 0;font-size:14.5px}
.alert.doubt{border-left-color:var(--gold)}
.alert div{flex:1;min-width:0}
.alert small{display:block;color:var(--mute)}
.alert a{flex:0 0 auto;width:38px;height:38px;border-radius:10px;background:#E6EAF5;color:var(--ink);display:grid;place-items:center}
.alert a svg{width:18px;height:18px}
.who{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.who span{font-size:13px;padding:3px 9px;border-radius:20px;background:var(--ns-bg);color:var(--mute);font-weight:600}
.who span.s-done{background:var(--done-bg);color:var(--done)}.who span.s-wip{background:var(--wip-bg);color:#8A5A00}
.who span.s-nd{background:var(--nd-bg);color:var(--nd)}.who span.s-bl{background:var(--bl-bg);color:var(--bl)}
.nav.six button{font-size:11.5px}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{border:1.5px solid var(--line);background:#fff;border-radius:22px;padding:8px 14px;font-weight:600;font-size:14.5px}
.pick button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.hintline{font-size:14px;color:var(--mute);margin-top:6px}
.hintline b{color:var(--ink)}
input[type=text],input[type=number]{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:12px;background:#fff;outline:none;font-size:16px}
input[type=text]:focus,input[type=number]:focus{border-color:var(--ink2)}
.addbtn{margin-top:16px}
.addbtn svg,.btn svg{width:19px;height:19px}
.clear{background:none;border:0;color:var(--ink2);font-weight:700;font-size:14px;padding:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="loading">Load ho raha hai...</div></div>

<script>
/* ====== Apps Script Web App URL yahan paste karo ====== */
const API_URL = 'https://script.google.com/macros/s/AKfycbydef8G6aaxfIyQgwJ_84rZ6GXteVujzoi7D9zLtPOq8iybGZinIIwpTiWzyJD8ad1EFg/exec';

const S = { team: [], me: null, code: '', pin: '', tab: 'report', open: null, pick: {}, msgs: null, msgLoading: false, doubt: {}, justDone: null, dash: null, dashLoading: false, df: 'all', dp: null, edit: null, editA: '', editR: [] };
const app = document.getElementById('app');

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };

const svg = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICON = {
  report: svg('<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>'),
  accept: svg('<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>'),
  verify: svg('<path d="M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6z"/><path d="m9 12 2 2 4-4"/>'),
  list:   svg('<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>'),
  msg:    svg('<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>'),
  refresh:svg('<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>'),
  logout: svg('<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5M5 12h11"/>'),
  phone:  svg('<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>'),
  camera: svg('<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>'),
  copy:   svg('<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>'),
  plus:   svg('<path d="M12 5v14M5 12h14"/>'),
  edit:   svg('<path d="M4 20h4L19 9l-4-4L4 16z"/>'),
  trash:  svg('<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'),
  chart:  svg('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'),
  send:   svg('<path d="M21 3 10 14M21 3l-7 18-4-7-7-4z"/>')
};

async function api(action, payload = {}) {
  if (API_URL.startsWith('PASTE')) throw new Error('index.html me API_URL daalna baaki hai');
  const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, code: S.code, pin: S.pin, ...payload }) });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'Server se jawab nahi aaya, dobara try karo');
  return j.data;
}

function toast(msg, err) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = 'toast' + (err ? ' err' : '');
  t.setAttribute('role', 'status');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2800);
}

const cls = st => ({ 'Done': 'done', 'Verify Pending': 'vp', 'WIP': 'wip', 'Not Done': 'nd', 'Blocked': 'bl' }[st] || 'ns');
const stName = st => ({ 'Done': 'Done', 'Verify Pending': 'Verify baaki', 'WIP': 'Chal raha hai', 'Not Done': 'Nahi hua', 'Blocked': 'Atka hua', 'Not Started': 'Shuru nahi hua' }[st] || st);
const idParts = id => { const i = String(id).indexOf('-'); return i < 0 ? ['', String(id)] : [id.slice(0, i), id.slice(i + 1)]; };
const plotBlock = (t, st) => { const [a, b] = idParts(t.id); return `<div class="plot s-${cls(st)}"><span>${esc(a)}</span><b>${esc(b)}</b></div>`; };
const roleTags = r => (r.includes('A') ? '<span class="tag a">Aap Accountable</span>' : '') + (r.includes('R') ? '<span class="tag">Aap Responsible</span>' : '');

function due(t) {
  const d = t.daysLeft;
  if (d === '' || d == null) return '';
  if (d < 0) return `<span class="due late">${-d} din late</span>`;
  if (d === 0) return '<span class="due soon">Aaj deadline</span>';
  if (d === 1) return '<span class="due soon">Kal deadline</span>';
  return `<span class="due">${d} din baaki, ${esc(t.deadline)} tak</span>`;
}

/* ---------- START / LOGIN ---------- */

async function start() {
  const c = lsGet('ts_code'), p = lsGet('ts_pin');
  if (c && p) {
    S.code = c; S.pin = p;
    let cached = null;
    try { cached = JSON.parse(lsGet('ts_me_' + c) || 'null'); } catch (e) {}
    if (cached && cached.tasks) {           // pichhla data turant dikhao, peeche se naya laao
      S.me = cached; S.tab = 'report'; S.stale = true; render();
      loadTeam();
      try { await loadMe(); S.stale = false; render(); } catch (e) { if (/PIN|Code/.test(e.message)) logout(); else { S.stale = false; render(); toast('Internet slow hai, purana data dikh raha hai', true); } }
      return;
    }
    try { await loadMe(true); loadTeam(); return; } catch (e) { lsSet('ts_pin', null); }
  }
  try { S.team = await api('team'); lsSet('ts_team', JSON.stringify(S.team)); }
  catch (e) { renderLogin(e.message); return; }
  renderLogin();
}
async function loadTeam() {
  try { S.team = JSON.parse(lsGet('ts_team') || '[]'); } catch (e) {}
  try { S.team = await api('team'); lsSet('ts_team', JSON.stringify(S.team)); } catch (e) {}
}

function renderLogin(error) {
  if (!S.team || !S.team.length) { try { S.team = JSON.parse(lsGet('ts_team') || '[]'); } catch (e) {} }
  const saved = lsGet('ts_code') || '';
  app.innerHTML = `
  <div class="login-bg"><div class="login">
    <div class="login-mark" aria-hidden="true"><i class="d"></i><i class="g"></i><i></i><i class="d"></i><i></i><i></i></div>
    <h1>Akshardham Associates</h1>
    <div class="sub">Roz ki task reporting, Project Sarola</div>
    ${error ? `<div class="note" style="margin-top:16px">${esc(error)}</div>` : `
    <label for="l-code">Aapka naam</label>
    <select id="l-code"><option value="">Naam chuno</option>
      ${S.team.map(m => `<option value="${esc(m.code)}" ${m.code === saved ? 'selected' : ''}>${esc(m.naam)}</option>`).join('')}
    </select>
    <label for="l-pin">PIN</label>
    <input id="l-pin" class="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn" id="l-btn" onclick="doLogin()">Login karo</button>
    <div class="foot">PIN nahi pata? Bhavesh se lijiye.</div>`}
  </div></div>`;
}

async function doLogin() {
  const code = document.getElementById('l-code').value;
  const pin = document.getElementById('l-pin').value.trim();
  if (!code) return toast('Pehle apna naam chuno', true);
  if (!pin) return toast('PIN daalo', true);
  const b = document.getElementById('l-btn'); b.disabled = true; b.textContent = 'Check ho raha hai...';
  S.code = code; S.pin = pin;
  try { await loadMe(true); lsSet('ts_code', code); lsSet('ts_pin', pin); }
  catch (e) { toast(e.message, true); b.disabled = false; b.textContent = 'Login karo'; }
}

function setMe(me) {
  S.me = me;
  lsSet('ts_me_' + S.code, JSON.stringify(me));
}
async function loadMe(first) {
  setMe(await api('login'));
  if (first) S.tab = S.me.tasks.some(t => t.needsAccept) ? 'accept' : 'report';
  render();
}

function logout() { lsSet('ts_pin', null); lsSet('ts_me_' + S.code, null); S.me = null; S.pin = ''; S.msgs = null; renderLogin(); }

const TITLES = {
  accept: ['Aapke kaam', 'Padh kar confirm karo ki aap ready ho'],
  verify: ['Verify karo', 'Team ne ye kaam Done bataye hain'],
  all: ['Mere saare kaam', 'Har kaam ka abhi ka status'],
  msgs: ['Aaj ke messages', 'Padh lo, phir Attendance group me bhejo'],
  dash: ['Project dashboard', '']
};

function render() {
  const T = S.me.tasks;
  const pend = T.filter(t => t.canReport && !t.reportedToday);
  const repd = T.filter(t => t.reportedToday);
  const acc = T.filter(t => t.needsAccept);
  const ver = T.filter(t => t.canVerify);
  const tabs = [
    ['report', 'Report', pend.filter(t => t.mustReport).length, ICON.report],
    ['accept', 'Accept', acc.length, ICON.accept],
    ...(ver.length ? [['verify', 'Verify', ver.length, ICON.verify]] : []),
    ['all', 'Mere kaam', 0, ICON.list],
    ...(S.me.isCoordinator ? [['dash', 'Dashboard', 0, ICON.chart], ['msgs', 'Messages', 0, ICON.msg]] : [])
  ];
  if (!tabs.some(t => t[0] === S.tab)) S.tab = 'report';
  const c = S.me.coordinator;
  const callBtn = c.mobile && S.code !== 'B' ? `<a class="ibtn" href="tel:${esc(c.mobile)}" aria-label="${esc(c.naam)} ko call karo">${ICON.phone}</a>` : '';
  const view = { report: viewReport, accept: viewAccept, verify: viewVerify, all: viewAll, msgs: viewMsgs, dash: viewDash }[S.tab]();

  app.innerHTML = `
  <header class="top"><div class="top-in">
    <div class="top-row">
      <div><div class="hello">Namaste, ${esc(S.me.naam)}</div><div class="sub">${esc(S.me.today)}, Project Sarola${S.stale ? ' · <span style="color:var(--gold)">update ho raha hai...</span>' : ''}</div></div>
      <div class="top-actions">${callBtn}
        <button class="ibtn" onclick="refresh()" aria-label="Refresh">${ICON.refresh}</button>
        <button class="ibtn" onclick="logout()" aria-label="Logout">${ICON.logout}</button></div>
    </div>
    ${S.tab === 'report' ? naksha(pend, repd) : S.tab === 'dash' && S.edit ? `<h1 class="page-title">${S.edit.id ? 'Kaam badlo' : 'Naya kaam jodo'}</h1><div class="page-sub">${S.edit.id ? esc(S.edit.id) + ': save karte hi Sheet me bhi badal jayega' : 'Save karte hi Sheet me nayi row ban jayegi'}</div>` : S.tab === 'dash' ? dashHead() : `<h1 class="page-title">${TITLES[S.tab][0]}</h1><div class="page-sub">${TITLES[S.tab][1]}</div>`}
  </div></header>
  <main class="wrap">${view}</main>
  <nav class="nav ${tabs.length > 5 ? 'six' : ''}" aria-label="Sections"><div class="nav-in">
    ${tabs.map(t => `<button class="${S.tab === t[0] ? 'on' : ''}" onclick="go('${t[0]}')" ${S.tab === t[0] ? 'aria-current="page"' : ''}>
      ${t[3]}${t[2] ? `<span class="badge">${t[2]}</span>` : ''}<span>${t[1]}</span></button>`).join('')}
  </div></nav>`;

  if (S.justDone) setTimeout(() => { S.justDone = null; }, 900);
  if (S.tab === 'msgs' && !S.msgs && !S.msgLoading) loadMsgs();
  if (S.tab === 'dash' && !S.dash && !S.dashLoading) loadDash();
}

function naksha(pend, repd) {
  const all = [...pend, ...repd].sort((a, b) => String(a.id).localeCompare(String(b.id)));
  if (!all.length) return `<h1 class="page-title">Aaj ki report</h1><div class="page-sub">Aaj aapke naam koi pending kaam nahi hai.</div>`;
  const done = repd.length, total = all.length;
  const txt = pend.length
    ? `kaam ki report aaj ho gayi. Baaki ${pend.length} ki shaam 6 baje tak daal do.`
    : 'Aaj ki saari report ho gayi. Shabash!';
  return `
    <div class="naksha-head"><div class="score"><b>${done}</b><span>/${total}</span></div><div class="score-txt">${txt}</div></div>
    <div class="naksha" role="list">
      ${all.map(t => {
        const st = t.reportedToday ? t.reportedToday.status : '';
        const [a, b] = idParts(t.id);
        return `<button role="listitem" class="plot-tile ${st ? 'f-' + cls(st) : ''} ${S.justDone === t.id ? 'just' : ''}" onclick="jump('${t.id}')" aria-label="${esc(t.kaam)}: ${st ? esc(stName(st)) : 'report baaki'}"><span>${esc(a)}</span><b>${esc(b)}</b></button>`;
      }).join('')}
    </div>
    <div class="legend"><span><i style="background:var(--done)"></i>Done</span><span><i style="background:var(--gold)"></i>Chal raha hai</span><span><i style="background:var(--nd)"></i>Nahi hua</span><span><i style="background:var(--bl)"></i>Atka hua</span><span><i class="lg-empty"></i>Report baaki</span></div>`;
}

function jump(id) {
  const t = S.me.tasks.find(x => x.id === id);
  if (t && !t.reportedToday) S.open = id;
  render();
  const el = document.getElementById('c-' + id);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function go(tab) { S.tab = tab; S.open = null; S.edit = null; render(); window.scrollTo(0, 0); }
async function refresh() { try { S.msgs = null; S.dash = null; await loadMe(); toast('Updated'); } catch (e) { toast(e.message, true); } }
function toggle(id) { S.open = S.open === id ? null : id; render(); }

/* ---------- REPORT ---------- */

function viewReport() {
  const T = S.me.tasks;
  const mine = T.filter(t => t.mustReport && !t.reportedToday);
  const asA = T.filter(t => t.canReport && !t.mustReport && !t.reportedToday);
  const pend = mine.concat(asA);
  const done = T.filter(t => t.reportedToday);
  let h = '';
  if (mine.length) h += `<div class="sec">Report baaki hai (${mine.length})</div>` + mine.map(reportCard).join('');
  if (asA.length) h += `<div class="sec">Aap Accountable ho (${asA.length})</div><div class="hintline" style="margin:-4px 2px 6px">Inki report team daalegi. Aap bhi update daal sakte ho.</div>` + asA.map(reportCard).join('');
  else if (done.length) h += `<div class="empty"><b>Aaj ka kaam pura</b>Saari report ho gayi. Kal subah naye kaam yahan dikhenge.</div>`;
  else h += `<div class="empty"><b>Aaj koi kaam nahi</b>Aapke naam abhi koi pending kaam nahi hai.</div>`;
  if (done.length) h += `<div class="sec">Aaj report di (${done.length})</div>` + done.map(t => `
    <div class="donerow" id="c-${esc(t.id)}">${plotBlock(t, t.reportedToday.status)}
      <div class="t"><div>${esc(t.kaam)}</div><p>${esc(t.reportedToday.kya)}</p></div>
      <span class="pill p-${cls(t.reportedToday.status)}">${esc(stName(t.reportedToday.status))}</span></div>`).join('');
  return h;
}

function reportCard(t) {
  const open = S.open === t.id;
  const pick = S.pick[t.id] || '';
  const opts = [['Done', 'Kaam pura'], ['WIP', 'Thoda kaam hua'], ['Not Done', 'Aaj nahi hua'], ['Blocked', 'Atka hua hai']];
  return `<div class="task ${open ? 'open' : ''}" id="c-${esc(t.id)}">
    <button class="task-h" onclick="toggle('${t.id}')" aria-expanded="${open}">${plotBlock(t, t.status)}
      <div class="task-main"><div class="task-title">${esc(t.kaam)}</div>
        <div class="task-meta">${due(t)}${t.status !== 'Not Started' ? `<span class="pill p-${cls(t.status)}">${esc(stName(t.status))}</span>` : ''}</div></div></button>
    ${open ? `<div class="task-body">
      <div class="info"><b>Done kab maanenge:</b> ${esc(t.done)}</div>
      <div class="info"><b>Accountable:</b> ${esc(t.aNames || '-')}&nbsp;&nbsp; <b>Team:</b> ${esc(t.rNames || '-')}</div>
      <details><summary>Kaise karna hai</summary><div class="steps">${esc(t.steps)}</div></details>
      <label>Aaj ka status</label>
      <div class="stgrid">${opts.map(([s, sub]) => `<button class="st ${pick === s ? 'on' : ''}" data-s="${s}" onclick="pickSt('${t.id}','${s}',this)"><i></i><span>${esc(stName(s))}<small>${sub}</small></span></button>`).join('')}</div>
      <label for="f-kya-${t.id}">Aaj kya kiya?</label>
      <textarea id="f-kya-${t.id}" placeholder="Do line me likho"></textarea>
      <label for="f-kal-${t.id}">Kal kya karoge? <small>(optional)</small></label>
      <textarea id="f-kal-${t.id}" placeholder="Agla step"></textarea>
      <label for="f-ruk-${t.id}" id="lb-ruk-${t.id}">${pick === 'Blocked' ? 'Kahan atke ho? Kisse help chahiye?' : 'Koi rukawat? <small>(optional)</small>'}</label>
      <textarea id="f-ruk-${t.id}" placeholder="Rukawat ya help"></textarea>
      <label>Photo proof <small>(optional)</small></label>
      <label class="file" style="margin:0;font-weight:500">${ICON.camera}<span id="f-fn-${t.id}">Photo lagao</span>
        <input type="file" id="f-photo-${t.id}" accept="image/*" onchange="document.getElementById('f-fn-${t.id}').textContent=this.files[0]?this.files[0].name:'Photo lagao'"></label>
      <button class="btn" id="f-btn-${t.id}" onclick="submitReport('${t.id}')">Report bhejo</button>
    </div>` : ''}
  </div>`;
}

function pickSt(id, s, el) {
  S.pick[id] = s;
  el.parentElement.querySelectorAll('.st').forEach(b => b.classList.toggle('on', b === el));
  const lb = document.getElementById('lb-ruk-' + id);
  if (lb) lb.innerHTML = s === 'Blocked' ? 'Kahan atke ho? Kisse help chahiye?' : 'Koi rukawat? <small>(optional)</small>';
}

function compress(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 1280 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res({ name: file.name, type: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.72).split(',')[1] });
    };
    img.onerror = () => rej(new Error('Photo khul nahi payi, dusri photo try karo'));
    img.src = url;
  });
}

async function submitReport(id) {
  const status = S.pick[id];
  const kya = document.getElementById('f-kya-' + id).value.trim();
  const kal = document.getElementById('f-kal-' + id).value.trim();
  const ruk = document.getElementById('f-ruk-' + id).value.trim();
  const file = document.getElementById('f-photo-' + id).files[0];
  if (!status) return toast('Pehle aaj ka status chuno', true);
  if (kya.length < 3) return toast('Aaj kya kiya, ye likhna zaroori hai', true);
  if (status === 'Blocked' && !ruk) return toast('Atka hua hai to rukawat likho', true);
  const b = document.getElementById('f-btn-' + id); b.disabled = true; b.textContent = 'Bhej rahe hain...';
  try {
    const photo = file ? await compress(file) : null;
    const prev = S.me;
    // turant dikhao, server ka jawab baad me aayega
    S.me = { ...S.me, tasks: S.me.tasks.map(t => t.id === id ? { ...t, reportedToday: { status, kya } } : t) };
    S.open = null; S.justDone = id; render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    toast('Report bhej rahe hain...');
    try {
      const r = await api('report', { taskId: id, status, kya, kal, rukawat: ruk, photo });
      delete S.pick[id]; S.dash = null;
      setMe(r.me); render();
      toast(r.status === 'Verify Pending' ? 'Report bhej di. Accountable verify karenge.' : 'Report bhej di');
    } catch (e) {
      S.me = prev; S.open = id; render();
      const f = (k, v) => { const el = document.getElementById(k + id); if (el) el.value = v; };
      f('f-kya-', kya); f('f-kal-', kal); f('f-ruk-', ruk);
      toast(e.message + ' (likha hua bacha hai, dobara bhejo)', true);
    }
  } catch (e) { toast(e.message, true); b.disabled = false; b.textContent = 'Report bhejo'; }
}

      <button class="btn ok" id="acc-all" onclick="acceptAll()">Saare ${acc.length} kaam padh liye, ready hoon</button></div>
    ${acc.map(t => `<div class="task open" id="c-${esc(t.id)}">
      <div class="task-h">${plotBlock(t, t.status)}<div class="task-main"><div class="task-title">${esc(t.kaam)}</div>
        <div class="task-meta">${roleTags(t.roles)}${due(t)}</div></div></div>
      <div class="task-body">
        <div class="info"><b>Done kab maanenge:</b> ${esc(t.done)}</div>
        <div class="info"><b>Accountable:</b> ${esc(t.aNames || '-')}&nbsp;&nbsp; <b>Team:</b> ${esc(t.rNames || '-')}</div>
        <details><summary>Kaise karna hai</summary><div class="steps">${esc(t.steps)}</div></details>
        ${t.note ? `<div class="note">${esc(t.note)}</div>` : ''}
        ${t.doubtPending ? `<div class="quote">Aapka sawal: "${esc(t.doubtPending)}"<br><small>${cn} aapse baat karenge.</small></div>` : ''}
        ${S.doubt[t.id]
          ? `<label for="d-${t.id}">Aapka sawal kya hai?</label><textarea id="d-${t.id}" placeholder="Jo samajh nahi aaya wo likho"></textarea>
             <div class="row2"><button class="btn soft" onclick="S.doubt['${t.id}']=false;render()">Wapas</button><button class="btn" onclick="sendDoubt('${t.id}')">Sawal bhejo</button></div>`
          : `<div class="row2"><button class="btn soft" onclick="S.doubt['${t.id}']=true;render()">Doubt hai</button><button class="btn ok" onclick="acceptOne('${t.id}',this)">Ready hoon</button></div>`}

async function sendAccept(items, btn, okMsg) {
  if (btn) { btn.disabled = true; btn.textContent = 'Save ho raha hai...'; }
  try { const r = await api('accept', { items }); S.dash = null; setMe(r.me); render(); toast(okMsg); }
  catch (e) { toast(e.message, true); if (btn) btn.disabled = false; render(); }
}
function acceptOne(id, btn) { sendAccept([{ taskId: id, response: 'Accepted' }], btn, 'Kaam accept ho gaya'); }
function acceptAll() {
  const items = S.me.tasks.filter(t => t.needsAccept).map(t => ({ taskId: t.id, response: 'Accepted' }));
  sendAccept(items, document.getElementById('acc-all'), 'Saare kaam accept ho gaye');
}
function sendDoubt(id) {
  const d = document.getElementById('d-' + id).value.trim();
  if (!d) return toast('Apna sawal likho', true);
  S.doubt[id] = false;
  sendAccept([{ taskId: id, response: 'Doubt', doubt: d }], null, `Sawal bhej diya. ${S.me.coordinator.naam} aapse baat karenge.`);
}

  const ver = S.me.tasks.filter(t => t.canVerify);
  if (!ver.length) return `<div class="empty"><b>Kuch verify karna baaki nahi</b>Jab koi Done report karega, wo yahan aayega.</div>`;
  return ver.map(t => {
    const l = t.last || {};
    return `<div class="task open" id="c-${esc(t.id)}">
      <div class="task-h">${plotBlock(t, 'Verify Pending')}<div class="task-main"><div class="task-title">${esc(t.kaam)}</div>
        <div class="task-meta"><span class="pill p-vp">Verify baaki</span>${due(t)}</div></div></div>
      <div class="task-body">
        <div class="info"><b>Done kab maanenge:</b> ${esc(t.done)}</div>
        <div class="quote"><b>${esc(l.naam || '')}</b>, ${esc(l.date || '')}<br>${esc(l.kya || '')}
          ${l.proof ? `<br><a href="${esc(l.proof)}" target="_blank" rel="noopener">Photo proof dekho</a>` : ''}</div>
        <label for="v-${t.id}">Comment <small>(wapas bhejne par zaroori)</small></label>
        <textarea id="v-${t.id}" placeholder="Kya kami hai, kya theek karna hai"></textarea>
        <div class="row2"><button class="btn out" onclick="verify('${t.id}','reject',this)">Wapas bhejo</button>
        <button class="btn ok" onclick="verify('${t.id}','approve',this)">Done approve karo</button></div>
      </div></div>`;
  }).join('');
}

async function verify(id, decision, btn) {
  const comment = document.getElementById('v-' + id).value.trim();
  if (decision === 'reject' && !comment) return toast('Wapas bhejne ka reason likho', true);
  btn.disabled = true;
  try { const r = await api('verify', { taskId: id, decision, comment }); S.dash = null; setMe(r.me); render(); toast(decision === 'approve' ? 'Done approve ho gaya' : 'Kaam wapas bhej diya'); }
  catch (e) { toast(e.message, true); btn.disabled = false; }
}

/* ---------- ALL TASKS ---------- */

function viewAll() {
  const T = S.me.tasks;
  if (!T.length) return `<div class="empty"><b>Koi kaam nahi</b>Aapke naam abhi koi kaam assign nahi hai.</div>`;
  const groups = [['Atke hue', ['Blocked']], ['Nahi hue', ['Not Done']], ['Chal rahe hain', ['WIP']], ['Shuru nahi hue', ['Not Started']], ['Verify baaki', ['Verify Pending']], ['Pure ho gaye', ['Done']]];
  return groups.map(([name, sts]) => {
    const list = T.filter(t => sts.includes(t.status)).sort((a, b) => (a.daysLeft === '' ? 999 : a.daysLeft) - (b.daysLeft === '' ? 999 : b.daysLeft));
    if (!list.length) return '';
    return `<div class="sec">${name} (${list.length})</div>` + list.map(t => {
      const open = S.open === t.id;
      return `<div class="task ${open ? 'open' : ''}" id="c-${esc(t.id)}">
        <button class="task-h" onclick="toggle('${t.id}')" aria-expanded="${open}">${plotBlock(t, t.status)}
          <div class="task-main"><div class="task-title">${esc(t.kaam)}</div>
          <div class="task-meta">${roleTags(t.roles)}${t.status !== 'Done' ? due(t) : ''}</div></div></button>
        ${open ? `<div class="task-body">
          <div class="info"><b>Done kab maanenge:</b> ${esc(t.done)}</div>
          <div class="info"><b>Accountable:</b> ${esc(t.aNames || '-')}&nbsp;&nbsp; <b>Team:</b> ${esc(t.rNames || '-')}</div>
          <details><summary>Kaise karna hai</summary><div class="steps">${esc(t.steps)}</div></details>
          ${t.last ? `<div class="quote">Aakhri report: <b>${esc(t.last.naam)}</b>, ${esc(t.last.date)}<br>${esc(t.last.kya)}</div>` : ''}
        </div>` : ''}</div>`;
    }).join('');
  }).join('');
}

/* ---------- DASHBOARD (Bhavesh / Krishan Sir) ---------- */

async function loadDash() {
  S.dashLoading = true;
  try { S.dash = await api('dashboard'); }
  catch (e) { S.dash = { error: e.message }; }
  S.dashLoading = false;
  if (S.tab === 'dash') render();
}

const isOpenSt = st => st !== 'Done' && st !== 'Verify Pending';
const isLate = t => isOpenSt(t.status) && t.daysLeft !== '' && t.daysLeft < 0;
const noRep = t => isOpenSt(t.status) && t.today.some(x => !x.status);

function dashHead() {
  const d = S.dash;
  if (!d || d.error) return `<h1 class="page-title">Project dashboard</h1><div class="page-sub">${d && d.error ? esc(d.error) : 'Data aa raha hai...'}</div>`;
  const done = d.counts['Done'] || 0;
  const tiles = [...d.tasks].sort((a, b) => String(a.id).localeCompare(String(b.id)));
  return `
    <div class="naksha-head"><div class="score"><b>${done}</b><span>/${d.total}</span></div>
      <div class="score-txt">kaam pure ho gaye. Ye ${esc(d.project)} ka poora naksha hai, har plot ek kaam.</div></div>
    <div class="naksha big" role="list">
      ${tiles.map(t => { const [a, b] = idParts(t.id); const c = t.status === 'Not Started' ? '' : 'f-' + cls(t.status);
        return `<button role="listitem" class="plot-tile ${c} ${isLate(t) ? 'late-mark' : ''}" onclick="dashJump('${t.id}')" aria-label="${esc(t.kaam)}: ${esc(stName(t.status))}"><span>${esc(a)}</span><b>${esc(b)}</b></button>`; }).join('')}
    </div>
    <div class="legend"><span><i style="background:var(--done)"></i>Done</span><span><i style="background:var(--vp)"></i>Verify baaki</span><span><i style="background:var(--gold)"></i>Chal raha hai</span><span><i style="background:var(--nd)"></i>Nahi hua</span><span><i style="background:var(--bl)"></i>Atka hua</span><span><i class="lg-empty"></i>Shuru nahi hua</span><span><i style="box-shadow:inset 0 0 0 2px var(--nd);background:transparent"></i>Late</span></div>
    <div class="updated">${esc(d.today)}, ${esc(d.updated)} tak ka data</div>`;
}

function dashJump(id) {
  S.df = 'all'; S.dp = null; S.open = id; render();
  const el = document.getElementById('c-' + id);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function setDf(f) { S.df = f; S.open = null; render(); document.getElementById('dash-tasks')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
function setDp(c) { S.dp = S.dp === c ? null : c; S.open = null; render(); document.getElementById('dash-tasks')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); }

function viewDash() {
  const d = S.dash;
  if (!d) return `<div class="loading">Dashboard taiyaar ho raha hai...</div>`;
  if (d.error) return `<div class="empty"><b>Dashboard load nahi hua</b>${esc(d.error)}</div>`;
  if (S.edit) return editForm();
  const T = d.tasks;
  const repDone = d.people.reduce((n, p) => n + p.repToday, 0), repDue = d.people.reduce((n, p) => n + p.dueToday, 0);
  const filters = [
    ['all', 'Saare kaam', T.length, false],
    ['norep', 'Aaj report nahi', T.filter(noRep).length, true],
    ['late', 'Late', T.filter(isLate).length, true],
    ['bl', 'Atke hue', T.filter(t => t.status === 'Blocked').length, true],
    ['vp', 'Verify baaki', T.filter(t => t.status === 'Verify Pending').length, false],
    ['noowner', 'Owner nahi', T.filter(t => t.noOwner).length, true],
    ['done', 'Pure', T.filter(t => t.status === 'Done').length, false]
  ];
  const fn = { all: () => true, norep: noRep, late: isLate, bl: t => t.status === 'Blocked', vp: t => t.status === 'Verify Pending', noowner: t => t.noOwner, done: t => t.status === 'Done' }[S.df];
  let list = T.filter(fn);
  if (S.dp) list = list.filter(t => t.rCodes.includes(S.dp));
  const rank = t => (t.status === 'Done' ? 2 : t.status === 'Verify Pending' ? 1 : 0);
  list.sort((a, b) => rank(a) - rank(b) || (a.daysLeft === '' ? 999 : a.daysLeft) - (b.daysLeft === '' ? 999 : b.daysLeft));
  const segColors = [['Done', 'var(--done)'], ['Verify Pending', 'var(--vp)'], ['WIP', 'var(--gold)'], ['Not Done', 'var(--nd)'], ['Blocked', 'var(--bl)']];
  const pName = S.dp ? (d.people.find(p => p.code === S.dp) || {}).naam : '';

  let h = `<button class="btn addbtn" onclick="openEdit()">${ICON.plus}Naya kaam jodo</button>`;
  h += `<div class="chips">${filters.map(([k, n, c, w]) => `<button class="chip ${S.df === k ? 'on' : ''} ${w && c ? 'warn' : ''}" onclick="setDf('${k}')">${n} <b>${c}</b></button>`).join('')}</div>`;

  h += `<div class="sec">Team, aaj ki reporting ${repDone}/${repDue}</div>` + d.people.map(p => {
    const segs = segColors.map(([s, col]) => p.st[s] ? `<i style="width:${p.st[s] / p.total * 100}%;background:${col}"></i>` : '').join('');
    return `<button class="prow ${S.dp === p.code ? 'on' : ''}" onclick="setDp('${p.code}')">
      <div class="pn">${esc(p.naam)}<small>${p.total} kaam</small></div>
      <div class="pbar"><div class="seg">${segs}</div>
        <div class="pcount"><span>Aaj report <b>${p.repToday}/${p.dueToday}</b></span><span>Accept <b>${p.accepted}/${p.accTotal}</b></span>${p.late ? `<span class="bad">${p.late} late</span>` : ''}</div></div></button>`;
  }).join('');

  const call = m => m ? `<a href="tel:${esc(m)}" aria-label="Call karo">${ICON.phone}</a>` : '';
  if (d.silent.length || d.doubts.length) {
    h += `<div class="sec">Aaj call karo</div>`
      + d.silent.map(s => `<div class="alert"><div><b>${esc(s.naam)}</b>: ${esc(s.kaam)}<small>${s.days} din se report nahi aayi</small></div>${call(s.mobile)}</div>`).join('')
      + d.doubts.map(x => `<div class="alert doubt"><div><b>${esc(x.naam)}</b> ka sawal: ${esc(x.kaam)}<small>"${esc(x.doubt)}"</small></div>${call(x.mobile)}</div>`).join('');
  }

  const fTitle = filters.find(f => f[0] === S.df)[1];
  h += `<div class="sec" id="dash-tasks" style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;scroll-margin-top:12px">
      <span>${esc(fTitle)}${pName ? ', ' + esc(pName) : ''} (${list.length})</span>
      ${S.dp || S.df !== 'all' ? `<button class="clear" onclick="S.df='all';S.dp=null;render()">Filter hatao</button>` : ''}</div>`;
  if (!list.length) return h + `<div class="empty"><b>Is filter me koi kaam nahi</b>Dusra filter chuno.</div>`;

  h += list.map(t => {
    const open = S.open === t.id;
    const l = t.last;
    return `<div class="task ${open ? 'open' : ''}" id="c-${esc(t.id)}" style="scroll-margin-top:12px">
      <button class="task-h" onclick="toggle('${t.id}')" aria-expanded="${open}">${plotBlock(t, t.status)}
        <div class="task-main"><div class="task-title">${esc(t.kaam)}</div>
        <div class="task-meta"><span class="pill p-${cls(t.status)}">${esc(stName(t.status))}</span>${t.status !== 'Done' ? due(t) : ''}${t.noOwner ? '<span class="due late">Owner nahi</span>' : ''}</div></div></button>
      ${open ? `<div class="task-body">
        <div class="info"><b>Accountable:</b> ${esc(t.aNames || 'koi nahi')}&nbsp;&nbsp; <b>Team:</b> ${esc(t.rNames || 'koi nahi')}</div>
        <div class="info"><b>Deadline:</b> ${esc(t.deadline || '-')}</div>
        ${t.today.length && isOpenSt(t.status) ? `<div class="info" style="margin-top:12px"><b>Aaj ki report</b></div>
          <div class="who">${t.today.map(x => `<span class="s-${x.status ? cls(x.status) : 'ns'}">${esc(x.naam)}: ${x.status ? esc(stName(x.status)) : 'abhi nahi'}</span>`).join('')}</div>` : ''}
        ${l ? `<div class="quote"><b>Aakhri report:</b> ${esc(l.naam)}, ${esc(l.date)}<br>${esc(l.kya)}
          ${l.rukawat ? `<br><b>Rukawat:</b> ${esc(l.rukawat)}` : ''}${l.kal ? `<br><b>Agla step:</b> ${esc(l.kal)}` : ''}
          ${l.proof ? `<br><a href="${esc(l.proof)}" target="_blank" rel="noopener">Photo proof dekho</a>` : ''}</div>`
        : '<div class="note">Is kaam ki abhi tak koi report nahi aayi.</div>'}
        ${t.note ? `<div class="note">${esc(t.note)}</div>` : ''}
        <div class="row2"><button class="btn soft" onclick="openEdit('${t.id}')">${ICON.edit}Badlo</button>
          <button class="btn out" id="del-${esc(t.id)}" onclick="deleteTask('${t.id}')">${ICON.trash}Hatao</button></div>
      </div>` : ''}</div>`;
  }).join('');
  return h;
}

/* ---------- KAAM ADD / EDIT / DELETE ---------- */

function openEdit(id) {
  const t = id ? S.dash.tasks.find(x => x.id === id) : null;
  S.edit = t ? { ...t } : { id: '', kaam: '', din: 7, done: '', steps: '', priority: 'Normal', start: '' };
  S.editA = t ? (t.aRaw[0] || '') : '';
  S.editR = t ? [...t.rRaw] : [];
  render(); window.scrollTo(0, 0);
}
function closeEdit() { const id = S.edit && S.edit.id; S.edit = null; S.open = id || null; render(); }
function pickA(c, el) { S.editA = c; el.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el)); }
function pickR(c, el) {
  const i = S.editR.indexOf(c);
  if (i < 0) S.editR.push(c); else S.editR.splice(i, 1);
  el.classList.toggle('on', i < 0);
}
function deadlineHint() {
  const din = parseInt(document.getElementById('e-din').value, 10);
  const el = document.getElementById('e-dl');
  if (!el) return;
  if (!(din >= 1)) { el.textContent = 'Din likho'; return; }
  const base = S.edit.start ? new Date(S.edit.start + 'T00:00:00') : new Date();
  base.setDate(base.getDate() + din);
  el.innerHTML = 'Deadline: <b>' + base.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) + '</b>' + (S.edit.start ? '' : ' (aaj se ' + din + ' din)');
}

function editForm() {
  const e = S.edit;
  const team = S.team;
  setTimeout(deadlineHint, 0);
  return `<div class="panel">
    <label for="e-kaam">Kaam kya hai?</label>
    <input type="text" id="e-kaam" value="${esc(e.kaam)}" placeholder="Jaise: Hoarding lagwana">
    <label>Accountable (A) <small>(ek chuno, jo kaam ka zimmedar hai)</small></label>
    <div class="pick">${team.map(m => `<button class="${S.editA === m.code ? 'on' : ''}" onclick="pickA('${m.code}',this)">${esc(m.naam)}</button>`).join('')}</div>
    <label>Responsible (R) <small>(jo kaam karenge, ek ya zyada)</small></label>
    <div class="pick">${team.map(m => `<button class="${S.editR.includes(m.code) ? 'on' : ''}" onclick="pickR('${m.code}',this)">${esc(m.naam)}</button>`).join('')}</div>
    <label for="e-din">Kitne din me hona hai?</label>
    <input type="number" id="e-din" min="1" max="365" inputmode="numeric" value="${esc(e.din)}" oninput="deadlineHint()">
    <div class="hintline" id="e-dl"></div>
    <label>Priority</label>
    <div class="pick">${['Normal', 'High'].map(p => `<button class="${(e.priority || 'Normal').indexOf(p) === 0 ? 'on' : ''}" onclick="S.edit.priority='${p}';this.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===this))">${p === 'High' ? 'Zaroori (High)' : 'Normal'}</button>`).join('')}</div>
    <label for="e-done">Done kab maanenge? <small>(optional)</small></label>
    <input type="text" id="e-done" value="${esc(e.done)}" placeholder="Jaise: 5 jagah hoarding lag gaye + photo">
    <label for="e-steps">Kaise karna hai? <small>(optional, har step nayi line me)</small></label>
    <textarea id="e-steps" placeholder="1. Location final karo&#10;2. Vendor se rate lo">${esc(e.steps)}</textarea>
    <div class="row2"><button class="btn soft" onclick="closeEdit()">Wapas</button>
      <button class="btn ok" id="e-save" onclick="saveTask()">${e.id ? 'Save karo' : 'Kaam jodo'}</button></div>
  </div>`;
}

async function saveTask() {
  const task = {
    id: S.edit.id || '',
    kaam: document.getElementById('e-kaam').value.trim(),
    a: S.editA, r: S.editR.join(','),
    din: document.getElementById('e-din').value,
    priority: S.edit.priority || 'Normal',
    done: document.getElementById('e-done').value.trim(),
    steps: document.getElementById('e-steps').value.trim()
  };
  if (task.kaam.length < 3) return toast('Kaam ka naam likho', true);
  if (!task.a) return toast('Accountable chuno', true);
  if (!task.r) return toast('Kam se kam ek Responsible chuno', true);
  if (!(parseInt(task.din, 10) >= 1)) return toast('Din likho', true);
  const b = document.getElementById('e-save'); b.disabled = true; b.textContent = 'Save ho raha hai...';
  try {
    const r = await api('taskSave', { task });
    const wasEdit = !!task.id;
    S.edit = null; S.dash = null; S.df = 'all'; S.dp = null; S.open = r.id;
    setMe(r.me); render();
    toast(wasEdit ? 'Badlav save ho gaya, Sheet bhi update ho gayi' : `Kaam jud gaya (${r.id}), Sheet me bhi aa gaya`);
  } catch (e) { toast(e.message, true); b.disabled = false; b.textContent = task.id ? 'Save karo' : 'Kaam jodo'; }
}

async function deleteTask(id) {
  const t = S.dash.tasks.find(x => x.id === id);
  if (!t) return;
  if (!confirm(`"${t.kaam}" ko hamesha ke liye hatana hai?\n\nYe Sheet se bhi hat jayega. Iski purani reports record me bachi rahengi.\n\nKaam pura hua hai to hatane ki jagah Done approve karo.`)) return;
  const b = document.getElementById('del-' + id); if (b) { b.disabled = true; b.textContent = 'Hata rahe hain...'; }
  try {
    const r = await api('taskDelete', { taskId: id });
    S.dash = null; S.open = null;
    setMe(r.me); render();
    toast('Kaam hata diya, Sheet se bhi hat gaya');
  } catch (e) { toast(e.message, true); if (b) { b.disabled = false; b.textContent = 'Hatao'; } }
}

/* ---------- MESSAGES ---------- */

async function loadMsgs(rebuild) {
  S.msgLoading = true;
  try { S.msgs = await api('messages', rebuild ? { rebuild } : {}); }
  catch (e) { S.msgs = { error: e.message }; }
  S.msgLoading = false;
  if (S.tab === 'msgs') render();
}
function rebuildMsg(which) { S.msgs = null; S.msgLoading = true; render(); loadMsgs(which); }

function viewMsgs() {
  const m = S.msgs;
  if (!m) return `<div class="loading">Message taiyaar ho raha hai...</div>`;
  if (m.error) return `<div class="empty"><b>Message load nahi hua</b>${esc(m.error)}</div>`;
  const sent = String(m.sent || '');
  const box = (key, title, hint, text, group, rebuild) => {
    const wasSent = group && sent.includes(title);
    return `<div class="msg"><h3>${title}</h3><div class="hint">${hint}</div>
      ${text ? `<div class="bubble ${group ? '' : 'private'}">${esc(text)}</div>` : `<div class="note">Ye message abhi bana nahi hai.</div>`}
      <div class="mbtns">
        ${text && group ? `<a class="mbtn wa full" href="https://wa.me/?text=${encodeURIComponent(text)}" target="_blank" rel="noopener" onclick="markSent('${title}')">${ICON.send}WhatsApp par bhejo</a>` : ''}
        ${text ? `<button class="mbtn" onclick="copyMsg('${key}')">${ICON.copy}Copy</button>` : ''}
        ${rebuild ? `<button class="mbtn" onclick="rebuildMsg('${rebuild}')">${ICON.refresh}${text ? 'Dobara banao' : 'Abhi banao'}</button>` : ''}
      </div>
      ${wasSent ? `<div class="sentnote">Aaj bhej diya gaya</div>` : ''}</div>`;
  };
  return box('morning', 'Subah ka message', 'Aaj ke kaam, Attendance group ke liye', m.morning, true, 'morning')
    + box('evening', 'Shaam ka feedback', 'Kisne kaam kiya, kiska baaki hai. 8 baje apne aap banta hai.', m.evening, true, 'evening')
    + box('alerts', 'Aapke liye alerts', 'Group me nahi bhejna. Inhe call karo.', m.alerts, false, '')
    + box('krishan', 'Krishan Sir ke liye summary', 'Sir ko personal me forward karo', m.krishan, false, '');
}

async function copyMsg(key) {
  const text = S.msgs[key];
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
  toast('Message copy ho gaya');
}
async function markSent(which) {
  try { const r = await api('markSent', { which }); S.msgs.sent = (S.msgs.sent ? S.msgs.sent + '\n' : '') + r.sent; render(); } catch (e) {}
}

start();
</script>
